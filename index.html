<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08100f">
  <meta name="description" content="Ridgebound M05.1 — a mountain goat speed-run prototype with corrected dual-stick controls, terrain-aware crash cameras, and severity-based procedural ragdoll physics in the French Alps.">
  <title>Ridgebound — Alpine Goat Speedrun</title>
  <style>:root {
  --ink: #08100f;
  --panel: rgba(7, 13, 12, 0.79);
  --panel-solid: #0b1211;
  --bone: #f1eee5;
  --muted: #aeb8b4;
  --line: rgba(235, 241, 235, 0.18);
  --amber: #f3b562;
  --amber-dark: #8b531f;
}

* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  min-height: 100%;
  margin: 0;
  overflow: hidden;
  background: #78949e;
  color: var(--bone);
  font-family: Arial, Helvetica, sans-serif;
}

button {
  color: inherit;
  font: inherit;
}

button:focus-visible {
  outline: 2px solid var(--amber);
  outline-offset: 3px;
}

.alpine-shell {
  position: relative;
  width: 100vw;
  height: 100svh;
  min-height: 620px;
  isolation: isolate;
  overflow: hidden;
  background:
    radial-gradient(circle at 24% 28%, rgba(255, 225, 184, 0.42), transparent 24%),
    linear-gradient(#355b77 0%, #b8cfce 48%, #e7cfad 100%);
}

.mountain-canvas,
.mountain-canvas canvas {
  position: absolute;
  inset: 0;
  display: block;
  width: 100%;
  height: 100%;
}

.mountain-canvas canvas {
  touch-action: none;
  cursor: crosshair;
}

.mountain-canvas canvas.mouse-look-active { cursor: none; }

.atmosphere {
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background:
    linear-gradient(180deg, rgba(4, 11, 14, 0.16), transparent 28%, transparent 72%, rgba(4, 9, 9, 0.46)),
    radial-gradient(circle at 50% 45%, transparent 48%, rgba(3, 8, 9, 0.25) 100%);
}

.grain {
  position: absolute;
  inset: -50%;
  z-index: 2;
  opacity: 0.055;
  pointer-events: none;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");
  transform: rotate(8deg);
}

.topbar {
  position: absolute;
  z-index: 5;
  top: 0;
  left: 0;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 22px 26px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.17);
  background: linear-gradient(180deg, rgba(4, 10, 11, 0.52), rgba(4, 10, 11, 0));
  pointer-events: none;
}

.brand-lockup,
.conditions {
  display: flex;
  align-items: center;
}

.brand-lockup {
  gap: 13px;
}

.brand-lockup p,
.brand-lockup span,
.conditions b,
.conditions span {
  display: block;
}

.brand-lockup p {
  margin: 0 0 3px;
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 0.2em;
}

.brand-lockup > div > span {
  color: rgba(240, 244, 238, 0.64);
  font-size: 9px;
  letter-spacing: 0.18em;
}

.brand-mark {
  position: relative;
  width: 34px;
  height: 34px;
  border: 1px solid rgba(255, 255, 255, 0.46);
  transform: rotate(45deg);
}

.brand-mark span {
  position: absolute;
  left: 7px;
  width: 18px;
  height: 1px;
  background: var(--amber);
}

.brand-mark span:nth-child(1) { top: 10px; transform: rotate(-28deg); }
.brand-mark span:nth-child(2) { top: 16px; transform: rotate(34deg); }
.brand-mark span:nth-child(3) { top: 22px; transform: rotate(-18deg); }

.conditions {
  gap: 11px;
  text-align: right;
}

.conditions b {
  margin-bottom: 2px;
  font-size: 13px;
  letter-spacing: 0.16em;
}

.conditions div span {
  color: rgba(239, 244, 239, 0.7);
  font-size: 9px;
  letter-spacing: 0.14em;
}

.status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #b9d78a;
  box-shadow: 0 0 12px rgba(185, 215, 138, 0.85);
}

.mission-panel {
  position: absolute;
  z-index: 7;
  top: 50%;
  left: 26px;
  width: min(390px, calc(100vw - 52px));
  transform: translateY(-48%);
  border: 1px solid var(--line);
  background: var(--panel);
  box-shadow: 0 25px 70px rgba(2, 6, 6, 0.28);
  backdrop-filter: blur(18px) saturate(115%);
  transition: transform 350ms ease;
}

.mission-panel::before {
  content: "";
  position: absolute;
  inset: 0 auto 0 0;
  width: 3px;
  background: linear-gradient(180deg, transparent, var(--amber), transparent);
}

.mission-panel.is-closed {
  transform: translate(calc(-100% - 26px), -48%);
}

.panel-content {
  padding: 28px 28px 26px;
}

.panel-toggle {
  position: absolute;
  top: -1px;
  right: -39px;
  width: 39px;
  height: 39px;
  border: 1px solid var(--line);
  border-left: 0;
  background: var(--panel);
  cursor: pointer;
  backdrop-filter: blur(18px);
}

.eyebrow {
  margin: 0;
  color: rgba(239, 244, 239, 0.66);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.18em;
}

.eyebrow > span {
  display: inline-block;
  width: 5px;
  height: 5px;
  margin: 0 7px 1px 0;
  border-radius: 50%;
  background: var(--amber);
  box-shadow: 0 0 8px rgba(243, 181, 98, 0.85);
}

.mission-panel h1 {
  max-width: 300px;
  margin: 12px 0 12px;
  font-family: Georgia, "Times New Roman", serif;
  font-size: clamp(34px, 4vw, 50px);
  font-weight: 400;
  line-height: 0.96;
  letter-spacing: -0.04em;
}

.mission-copy {
  max-width: 325px;
  margin: 0;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.6;
}

.data-badge {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 15px;
  color: rgba(231, 237, 231, 0.58);
  font-family: "Courier New", monospace;
  font-size: 8px;
  letter-spacing: 0.08em;
}

.data-badge span {
  padding: 4px 6px;
  border: 1px solid rgba(185, 215, 138, 0.35);
  color: #c8dba8;
  letter-spacing: 0.12em;
}

.metric-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1px;
  margin: 23px 0;
  border: 1px solid var(--line);
  background: var(--line);
}

.metric-grid div {
  padding: 12px 13px 11px;
  background: rgba(5, 10, 10, 0.58);
}

.metric-grid span,
.metric-grid b {
  display: block;
}

.metric-grid span {
  margin-bottom: 5px;
  color: rgba(224, 232, 227, 0.48);
  font-size: 8px;
  letter-spacing: 0.16em;
}

.metric-grid b {
  font-family: "Courier New", monospace;
  font-size: 12px;
  letter-spacing: 0.08em;
}

.action-row {
  display: grid;
  grid-template-columns: 1.15fr 0.85fr 0.85fr;
  gap: 8px;
}

.action-row button,
.telemetry-actions button {
  border: 1px solid var(--line);
  cursor: pointer;
  transition: 160ms ease;
}

.action-row button {
  min-height: 45px;
  padding: 0 13px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.07em;
}

.action-row button:hover,
.telemetry-actions button:hover {
  border-color: rgba(243, 181, 98, 0.68);
  transform: translateY(-1px);
}

.action-row .primary {
  background: var(--amber);
  color: var(--ink);
}

.action-row .primary.active {
  box-shadow: 0 0 0 2px rgba(243, 181, 98, 0.22), 0 10px 28px rgba(89, 52, 17, 0.28);
}

.action-row .secondary {
  background: rgba(255, 255, 255, 0.035);
}

.action-row .secondary.active {
  border-color: rgba(255, 255, 255, 0.5);
  background: rgba(255, 255, 255, 0.1);
}

.play-icon {
  margin-right: 7px;
  font-size: 8px;
}

.telemetry-panel {
  position: absolute;
  z-index: 6;
  right: 26px;
  bottom: 72px;
  width: 360px;
  padding: 19px 20px 17px;
  border: 1px solid var(--line);
  background: rgba(6, 12, 12, 0.72);
  backdrop-filter: blur(15px);
  transition: transform 300ms ease;
}

.telemetry-panel.is-closed {
  transform: translateX(calc(100% + 26px));
}

.telemetry-toggle {
  position: absolute;
  top: -1px;
  left: -39px;
  width: 39px;
  height: 39px;
  padding: 0;
  border: 1px solid var(--line);
  border-right: 0;
  background: rgba(6, 12, 12, 0.72);
  font-size: 22px;
  line-height: 1;
  cursor: pointer;
  backdrop-filter: blur(15px);
}

.telemetry-row {
  display: grid;
  grid-template-columns: 1.18fr 1.15fr 0.85fr 0.48fr;
  gap: 12px;
  margin-top: 13px;
}

.telemetry-row span,
.telemetry-row b {
  display: block;
}

.telemetry-row span {
  margin-bottom: 4px;
  color: rgba(224, 232, 227, 0.45);
  font-size: 8px;
  letter-spacing: 0.14em;
}

.telemetry-row b {
  font-family: "Courier New", monospace;
  font-size: 11px;
  letter-spacing: 0.05em;
}

.elevation-profile {
  height: 72px;
  margin: 14px 0 12px;
  border-top: 1px solid rgba(255, 255, 255, 0.09);
  border-bottom: 1px solid rgba(255, 255, 255, 0.09);
}

.elevation-profile svg {
  width: 100%;
  height: 100%;
  overflow: visible;
}

.profile-grid {
  fill: none;
  stroke: rgba(255, 255, 255, 0.07);
  stroke-width: 1;
}

.profile-fill { fill: url(#profileFill); }

.profile-line {
  fill: none;
  stroke: var(--amber);
  stroke-width: 1.5;
  vector-effect: non-scaling-stroke;
}

.profile-progress {
  stroke: rgba(255, 255, 255, 0.75);
  stroke-width: 1;
  stroke-dasharray: 2 3;
}

.telemetry-actions {
  display: flex;
  gap: 8px;
}

.telemetry-actions button {
  flex: 1;
  min-height: 34px;
  background: rgba(255, 255, 255, 0.04);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.06em;
}

.telemetry-actions button.active {
  border-color: rgba(243, 181, 98, 0.44);
}

.route-swatch {
  display: inline-block;
  width: 12px;
  height: 2px;
  margin: 0 5px 2px 0;
  background: var(--amber);
  box-shadow: 0 0 6px var(--amber);
}

.mobile-controls {
  position: absolute;
  z-index: 6;
  right: 16px;
  bottom: 62px;
  left: 16px;
  display: none;
  align-items: flex-end;
  justify-content: space-between;
  pointer-events: none;
}

.joystick-cluster {
  display: grid;
  justify-items: center;
  gap: 6px;
  pointer-events: auto;
}

.joystick-label {
  color: rgba(241, 238, 229, 0.7);
  font-family: "Courier New", monospace;
  font-size: 8px;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-shadow: 0 2px 8px rgba(0, 0, 0, 0.62);
}

.joystick-base {
  position: relative;
  width: 112px;
  height: 112px;
  padding: 0;
  overflow: hidden;
  border: 1px solid rgba(255, 255, 255, 0.3);
  border-radius: 50%;
  background:
    radial-gradient(circle, rgba(255, 255, 255, 0.055) 0 31%, transparent 32%),
    rgba(6, 12, 12, 0.66);
  box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.28), 0 9px 28px rgba(0, 0, 0, 0.24);
  backdrop-filter: blur(12px);
  cursor: grab;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}

.joystick-base::before,
.joystick-base::after {
  content: "";
  position: absolute;
  top: 50%;
  left: 50%;
  background: rgba(255, 255, 255, 0.1);
  transform: translate(-50%, -50%);
}

.joystick-base::before { width: 1px; height: 76%; }
.joystick-base::after { width: 76%; height: 1px; }

.joystick-base:active { cursor: grabbing; }

.joystick-ring {
  position: absolute;
  inset: 27px;
  border: 1px dashed rgba(243, 181, 98, 0.2);
  border-radius: 50%;
}

.joystick-thumb {
  position: absolute;
  z-index: 2;
  top: 50%;
  left: 50%;
  width: 44px;
  height: 44px;
  margin: -22px 0 0 -22px;
  border: 1px solid rgba(243, 181, 98, 0.68);
  border-radius: 50%;
  background: radial-gradient(circle at 38% 32%, #d6a35e, #835020 72%);
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.42), 0 0 18px rgba(243, 181, 98, 0.2);
  pointer-events: none;
  will-change: transform;
}

.mobile-actions {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 7px;
  pointer-events: auto;
}

.mobile-control {
  width: 54px;
  height: 54px;
  padding: 0;
  border: 1px solid rgba(255, 255, 255, 0.3);
  border-radius: 9px;
  background: rgba(6, 12, 12, 0.7);
  box-shadow: inset 0 -3px 0 rgba(255, 255, 255, 0.08), 0 7px 22px rgba(0, 0, 0, 0.2);
  backdrop-filter: blur(12px);
  color: rgba(245, 242, 233, 0.94);
  font-family: "Courier New", monospace;
  font-size: 17px;
  font-weight: 700;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}

.mobile-control:active {
  border-color: var(--amber);
  background: rgba(243, 181, 98, 0.25);
  transform: translateY(2px);
}

.mobile-control.run,
.mobile-control.jump {
  width: 54px;
  height: 54px;
  border-radius: 50%;
  font-size: 9px;
  letter-spacing: 0.08em;
}

.mobile-control.jump {
  border-color: rgba(243, 181, 98, 0.56);
  background: rgba(103, 59, 21, 0.72);
}

.camera-center {
  width: 54px;
  min-height: 28px;
  padding: 0 5px;
  border: 1px solid rgba(255, 255, 255, 0.24);
  border-radius: 5px;
  background: rgba(6, 12, 12, 0.72);
  color: rgba(241, 238, 229, 0.72);
  font-family: "Courier New", monospace;
  font-size: 7px;
  font-weight: 700;
  line-height: 1.1;
  letter-spacing: 0.05em;
  touch-action: manipulation;
}

.camera-center:active {
  border-color: var(--amber);
  color: var(--amber);
}

.crash-camera-hud {
  position: absolute;
  z-index: 10;
  top: 82px;
  left: 50%;
  min-width: 260px;
  padding: 11px 15px 10px;
  transform: translateX(-50%);
  border: 1px solid rgba(225, 111, 78, 0.42);
  background: rgba(7, 11, 11, 0.76);
  box-shadow: 0 12px 38px rgba(0, 0, 0, 0.28);
  backdrop-filter: blur(14px);
  pointer-events: none;
  text-align: center;
}

.crash-camera-hud > div {
  display: flex;
  align-items: center;
  justify-content: center;
  color: rgba(243, 181, 98, 0.78);
  font-size: 7px;
  font-weight: 800;
  letter-spacing: 0.2em;
}

.crash-camera-hud > div span {
  width: 6px;
  height: 6px;
  margin-right: 7px;
  border-radius: 50%;
  background: #df6d4b;
  box-shadow: 0 0 10px rgba(223, 109, 75, 0.88);
}

.crash-camera-hud b,
.crash-camera-hud small {
  display: block;
}

.crash-camera-hud b {
  margin-top: 5px;
  font-family: "Courier New", monospace;
  font-size: 10px;
  letter-spacing: 0.08em;
}

.crash-camera-hud small {
  margin-top: 4px;
  color: rgba(229, 234, 228, 0.42);
  font-family: "Courier New", monospace;
  font-size: 6px;
  letter-spacing: 0.1em;
}

.is-crashing .mission-panel,
.is-crashing .telemetry-panel {
  opacity: 0.18;
  filter: saturate(0.35);
  pointer-events: none;
}

.is-crashing .atmosphere {
  background:
    linear-gradient(180deg, rgba(4, 11, 14, 0.14), transparent 30%, transparent 68%, rgba(4, 9, 9, 0.52)),
    radial-gradient(circle at 50% 45%, transparent 42%, rgba(3, 8, 9, 0.42) 100%);
}

.failure-overlay {
  position: absolute;
  inset: 0;
  z-index: 12;
  display: grid;
  place-items: center;
  padding: 80px 20px 70px;
  pointer-events: none;
  background:
    radial-gradient(circle at 50% 48%, rgba(17, 7, 6, 0.18) 0 18%, rgba(10, 7, 7, 0.74) 74%),
    linear-gradient(180deg, rgba(40, 8, 5, 0.08), rgba(40, 8, 5, 0.34));
}

.failure-card {
  position: relative;
  width: min(410px, calc(100vw - 36px));
  padding: 30px 30px 24px;
  overflow: hidden;
  border: 1px solid rgba(225, 111, 78, 0.5);
  background: rgba(10, 12, 11, 0.91);
  box-shadow: 0 30px 90px rgba(0, 0, 0, 0.58), 0 0 60px rgba(123, 37, 18, 0.14);
  backdrop-filter: blur(22px) saturate(112%);
  pointer-events: auto;
  animation: failure-in 420ms cubic-bezier(0.2, 0.78, 0.2, 1) both;
}

.failure-card::before {
  content: "";
  position: absolute;
  inset: 0 auto 0 0;
  width: 3px;
  background: linear-gradient(180deg, transparent, #df6d4b 25%, #f3b562 72%, transparent);
}

.failure-card .eyebrow {
  color: rgba(244, 173, 145, 0.78);
}

.failure-card h2 {
  margin: 10px 0 9px;
  color: #f4eee4;
  font-family: Georgia, "Times New Roman", serif;
  font-size: clamp(38px, 7vw, 54px);
  font-weight: 400;
  line-height: 0.98;
  letter-spacing: -0.04em;
}

.failure-card h2 + p {
  margin: 0;
  color: rgba(232, 233, 226, 0.66);
  font-size: 12px;
  line-height: 1.58;
}

.failure-stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1px;
  margin: 21px 0 16px;
  border: 1px solid rgba(255, 255, 255, 0.13);
  background: rgba(255, 255, 255, 0.13);
}

.failure-stats div {
  padding: 11px 12px;
  background: rgba(5, 9, 9, 0.84);
}

.failure-stats span,
.failure-stats b {
  display: block;
}

.failure-stats span {
  margin-bottom: 5px;
  color: rgba(225, 230, 224, 0.42);
  font-size: 7px;
  letter-spacing: 0.16em;
}

.failure-stats b {
  font-family: "Courier New", monospace;
  font-size: 12px;
  letter-spacing: 0.06em;
}

.failure-card button {
  width: 100%;
  min-height: 48px;
  border: 1px solid #f3b562;
  background: #f3b562;
  color: #101310;
  cursor: pointer;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.13em;
  transition: transform 150ms ease, filter 150ms ease;
}

.failure-card button:hover {
  filter: brightness(1.08);
  transform: translateY(-1px);
}

.failure-card button span {
  display: inline-grid;
  min-width: 24px;
  height: 20px;
  margin-left: 8px;
  place-items: center;
  border: 1px solid rgba(8, 16, 15, 0.38);
  font-family: "Courier New", monospace;
  font-size: 8px;
}

.failure-card .failure-footnote {
  margin: 12px 0 0;
  color: rgba(230, 235, 229, 0.42);
  font-family: "Courier New", monospace;
  font-size: 7px;
  letter-spacing: 0.13em;
  text-align: center;
}

.has-failure .mission-panel,
.has-failure .telemetry-panel {
  opacity: 0.35;
  filter: saturate(0.45);
  pointer-events: none;
}

.has-failure .atmosphere {
  background:
    linear-gradient(180deg, rgba(34, 5, 4, 0.16), transparent 32%, transparent 64%, rgba(35, 5, 4, 0.56)),
    radial-gradient(circle at 50% 45%, transparent 28%, rgba(48, 7, 5, 0.52) 100%);
}

@keyframes failure-in {
  from {
    opacity: 0;
    transform: translateY(18px) scale(0.97);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

.control-strip {
  position: absolute;
  z-index: 6;
  right: 0;
  bottom: 0;
  left: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 50px;
  padding: 0 26px;
  border-top: 1px solid rgba(255, 255, 255, 0.14);
  background: rgba(5, 10, 10, 0.67);
  backdrop-filter: blur(12px);
}

.control-strip > div {
  display: flex;
  align-items: center;
  gap: 7px;
}

.control-strip b {
  margin-right: 12px;
  color: rgba(237, 242, 237, 0.55);
  font-size: 8px;
  letter-spacing: 0.13em;
}

.control-key {
  display: inline-grid;
  min-width: 32px;
  height: 22px;
  place-items: center;
  border: 1px solid rgba(255, 255, 255, 0.26);
  border-bottom-color: rgba(255, 255, 255, 0.42);
  border-radius: 3px;
  background: rgba(255, 255, 255, 0.05);
  box-shadow: inset 0 -2px 0 rgba(255, 255, 255, 0.08);
  font-family: "Courier New", monospace;
  font-size: 8px;
}

.control-key.wide { min-width: 41px; }

.control-strip p {
  margin: 0;
  color: rgba(237, 242, 237, 0.48);
  font-size: 8px;
  letter-spacing: 0.13em;
}

.control-strip p span {
  display: inline-block;
  width: 5px;
  height: 5px;
  margin: 0 7px 1px 0;
  border-radius: 50%;
  background: #b9d78a;
}

.webgl-error {
  position: absolute;
  z-index: 20;
  top: 50%;
  left: 50%;
  width: min(480px, calc(100% - 40px));
  padding: 32px;
  transform: translate(-50%, -50%);
  border: 1px solid var(--line);
  background: var(--panel-solid);
  text-align: center;
}

.webgl-error h1 {
  margin: 10px 0;
  font-family: Georgia, serif;
  font-weight: 400;
}

.webgl-error p:last-child {
  color: var(--muted);
  line-height: 1.6;
}

@media (max-width: 800px) {
  .alpine-shell { min-height: 520px; }

  .topbar { padding: 16px; }

  .conditions div span { display: none; }

  .mission-panel {
    top: auto;
    right: 16px;
    bottom: 70px;
    left: 16px;
    width: auto;
    transform: none;
  }

  .mission-panel.is-closed {
    transform: translateY(calc(100% + 70px));
  }

  .panel-toggle {
    top: -39px;
    right: -1px;
    border-left: 1px solid var(--line);
    border-bottom: 0;
  }

  .panel-content { padding: 20px 20px 18px; }

  .mission-panel h1 {
    margin: 8px 0;
    font-size: 34px;
  }

  .mission-copy {
    display: -webkit-box;
    overflow: hidden;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
  }

  .metric-grid {
    grid-template-columns: repeat(4, 1fr);
    margin: 15px 0;
  }

  .data-badge { display: none; }

  .metric-grid div { padding: 9px 7px; }
  .metric-grid span { font-size: 6px; }
  .metric-grid b { font-size: 9px; }

  .telemetry-panel {
    top: 75px;
    right: 16px;
    bottom: auto;
    width: 236px;
    padding: 12px 13px;
  }

  .telemetry-panel.is-closed {
    transform: translateX(calc(100% + 16px));
  }

  .telemetry-row {
    grid-template-columns: 1fr 1fr 0.8fr;
    gap: 7px;
    margin-top: 8px;
  }

  .telemetry-row div:last-child,
  .elevation-profile { display: none; }

  .telemetry-actions { margin-top: 10px; }

  .telemetry-actions button {
    min-height: 31px;
    font-size: 8px;
  }

  .mobile-controls { display: flex; }

  .crash-camera-hud {
    top: 64px;
    min-width: 232px;
    padding: 9px 12px 8px;
  }

  .failure-overlay {
    padding: 68px 14px 58px;
  }

  .failure-card {
    width: min(390px, calc(100vw - 28px));
    padding: 24px 23px 20px;
  }

  .failure-card h2 {
    font-size: clamp(36px, 12vw, 50px);
  }

  .control-strip {
    min-height: 45px;
    padding: 0 16px;
  }

  .control-strip > div { display: none; }

  .control-strip p {
    width: 100%;
    text-align: center;
  }
}

@media (max-width: 480px) {
  .brand-lockup > div > span { display: none; }
  .brand-mark { width: 28px; height: 28px; }
  .brand-mark span { left: 5px; }
  .conditions { display: none; }

  .mission-panel h1 { font-size: 29px; }
  .mission-copy { font-size: 10px; }
  .action-row button { min-height: 41px; font-size: 9px; }

  .telemetry-panel {
    top: 64px;
    right: 10px;
    width: 214px;
  }

  .joystick-base {
    width: 96px;
    height: 96px;
  }

  .joystick-ring {
    inset: 23px;
  }

  .joystick-thumb {
    width: 40px;
    height: 40px;
    margin: -20px 0 0 -20px;
  }

  .mobile-control {
    width: 48px;
    height: 48px;
  }

  .mobile-control.run,
  .mobile-control.jump {
    width: 50px;
    height: 50px;
  }

  .camera-center { width: 50px; }
}

@media (max-width: 360px) {
  .mobile-controls {
    right: 9px;
    left: 9px;
  }

  .joystick-base {
    width: 86px;
    height: 86px;
  }

  .joystick-ring { inset: 20px; }

  .joystick-thumb {
    width: 36px;
    height: 36px;
    margin: -18px 0 0 -18px;
  }

  .mobile-control.run,
  .mobile-control.jump,
  .camera-center {
    width: 46px;
  }

  .mobile-control.run,
  .mobile-control.jump {
    height: 46px;
  }
}

@media (pointer: coarse) {
  .mobile-controls { display: flex; }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}
